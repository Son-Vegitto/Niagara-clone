name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v -keystore release.keystore \
          -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass androidpassword -keypass androidpassword \
          -dname "CN=NiagaraClone, OU=Dev, O=Launcher, L=City, S=State, C=US"

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK with apksigner
      run: |
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks release.keystore \
          --ks-pass pass:androidpassword \
          --key-pass pass:androidpassword \
          --out app/build/outputs/apk/release/NiagaraClone-Release.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Clean Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NiagaraClone-Release-APK
        path: app/build/outputs/apk/release/NiagaraClone-Release.apk
        
