name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Updated from deprecated gradle/gradle-build-action@v3
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.4

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v -keystore release.keystore \
          -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass androidpassword -keypass androidpassword \
          -dname "CN=NiagaraClone, OU=Dev, O=Launcher, L=City, S=State, C=US"

    # Switched 'gradle' to './gradlew' for consistency and reliability
    - name: Build and Sign Release APK
      run: |
        ./gradlew assembleRelease --stacktrace \
          -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
          -Pandroid.injected.signing.store.password=androidpassword \
          -Pandroid.injected.signing.key.alias=my-key-alias \
          -Pandroid.injected.signing.key.password=androidpassword

    - name: Upload Clean Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NiagaraClone-Release-APK
        path: app/build/outputs/apk/release/*.apk
        
